# Phase 2b: compare adherence prompt vs phase-2 winner on diverse clips.
# Variants are built dynamically from winners.yaml (baseline vs adherence at
# phase-1 winner noise and one grid step higher).
phase: phase2b_adherence_prompt
steps: 8
cfg_scale: 1.0
silence_enforce: true

clip_seconds: 10
diverse_stems_per_category: 5
min_rms: 0.01
include_negative_prompt: false

noise_levels:
  - 0.25
  - 0.35
  - 0.45
  - 0.55
  - 0.65

variants: []
