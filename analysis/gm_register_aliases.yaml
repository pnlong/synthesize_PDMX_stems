# Curated track-name → GM program corrections for the sPDMX register.
# Matcher sorts needles by length descending (longest wins).
# Matching folds accents (ténor → tenor, flûte → flute).
# Bare "bass" / "basse" / "synth" are intentionally absent — too ambiguous.
# Short needles (<5 chars) use word boundaries (chor ⊄ harpsichord).

generic_skip:
  - melody
  - harmony
  - accompaniment
  - accomp
  - track
  - staff
  - part
  - right hand
  - left hand
  - rh
  - lh
  - untitled
  - unnamed
  - midi
  - instrument
  - channel
  - continuo
  - accomp.
  - musicxml part

# Coarse labels → canonical program only when current program is outside that GM class.
# No bare "synth" / "pad" — those wrongly map Warm/Pad/Bass Synthesizer → Lead 1 (square).
family_defaults:
